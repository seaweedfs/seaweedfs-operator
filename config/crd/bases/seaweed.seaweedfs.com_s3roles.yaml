                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Ready
                - Failed
                - Terminating
                type: string
              roleArn:
                type: string
              roleName:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
