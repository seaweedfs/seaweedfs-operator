---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: s3roles.seaweed.seaweedfs.com
spec:
  group: seaweed.seaweedfs.com
  names:
    categories:
    - seaweedfs
    kind: S3Role
    listKind: S3RoleList
    plural: s3roles
    shortNames:
    - s3role
    singular: s3role
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.seaweedRef.name
      name: Cluster
      type: string
    - jsonPath: .status.roleName
      name: Role
      type: string
    - jsonPath: .status.roleArn
      name: ARN
      priority: 1
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                maxLength: 1000
                type: string
              maxSessionDuration:
                format: int64
                maximum: 43200
                minimum: 3600
                type: integer
              name:
                maxLength: 64
                minLength: 1
                pattern: ^[\w+=,.@-]+$
                type: string
                x-kubernetes-validations:
                - message: role name is immutable once set
                  rule: oldSelf == '' || self == oldSelf
              policyRefs:
                items:
                  properties:
                    name:
                      maxLength: 128
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              reclaimPolicy:
                default: Delete
                enum:
                - Delete
                - Retain
                type: string
              seaweedRef:
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: seaweedRef is immutable
                  rule: self == oldSelf
              webIdentity:
                properties:
                  providerRef:
                    properties:
                      name:
