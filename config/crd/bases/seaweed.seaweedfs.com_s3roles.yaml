                        type: string
                    required:
                    - name
                    type: object
                  subjects:
                    items:
                      maxLength: 1024
                      minLength: 1
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: 'a subject must not contain ''${'': the policy engine
                        expands it as a variable'
                      rule: self.all(s, !s.contains('${'))
                required:
                - providerRef
                - subjects
                type: object
            required:
            - seaweedRef
            - webIdentity
            type: object
          status:
            properties:
              attachedPolicies:
                items:
                  type: string
                type: array
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
