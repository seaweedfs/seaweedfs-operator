# Binds the CSI-only ClusterRole to the manager ServiceAccount that
# config/rbac/role_binding.yaml binds the default role to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: seaweedfs-operator-manager-role-csi-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: seaweedfs-operator-manager-role-csi
subjects:
- kind: ServiceAccount
  name: default
  namespace: seaweedfs-operator-system
