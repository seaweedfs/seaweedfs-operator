# Dedicated identity for the manager. The manager authenticates to the API
# server with this account's projected token, so the token stays mounted; the
# point of a separate account is that it is not the namespace's `default`,
# which every other pod in `system` shares and so inherits the manager's
# cluster-wide permissions from. Bound by role_binding.yaml,
# leader_election_role_binding.yaml and metrics_auth_role_binding.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: system
