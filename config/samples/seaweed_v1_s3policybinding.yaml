apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: alice-uploads-binding
  namespace: default
spec:
  seaweedRef:
    name: seaweed-sample
  # The IAM policy to attach (equals the resolved name of an S3Policy).
  policyRef:
    name: rw-uploads
  # The subjects the policy is attached to. The controller reconciles to
  # exactly this set — subjects removed here have the policy detached.
  # kind: S3Identity attaches to an IAM user; kind: Bucket stores the
  # document as that bucket's bucket policy (which therefore needs a
  # Principal per statement — use spec.policyDocument on the S3Policy),
  # e.g.:
  #   - kind: Bucket
  #     name: shared-bucket
  subjects:
    - kind: S3Identity
      name: alice
  # reclaimPolicy: Retain  # default Delete: removing this CR detaches the
  #                        # policy from all listed subjects
