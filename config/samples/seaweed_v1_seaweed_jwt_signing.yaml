# JWT signing between SeaweedFS components, rendered into security.toml.
#
# Every section is off by default: the operator only writes a [jwt.*] section
# once it is turned on here, and a section that is absent means the matching
# guard is not enforced. Keys are generated once and preserved across
# reconciles; turning a section off and back on mints a new one.
#
# Toggling a flag re-rolls the pods that mount security.toml, so the whole
# cluster picks up the change together.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed-jwt
  namespace: default
spec:
  image: chrislusf/seaweedfs:latest
  volumeServerDiskCount: 1
  master:
    replicas: 3
    volumeSizeLimitMB: 1024
  volume:
    replicas: 2
    requests:
      storage: 2Gi
  filer:
    replicas: 2
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
  s3:
    replicas: 1
  securityConfig:
    jwtSigning:
      # [jwt.signing] — the master signs an upload token for every file id it
      # assigns and the volume server rejects unsigned writes. This is what the
      # official Helm chart turns on by default.
      volumeWrite: true

      # [jwt.signing.read] — the volume server requires a signed token on reads
      # too. Clients that read chunks directly from a volume server (weed
      # mount, the CSI driver) need the same key.
      volumeRead: false

      # [jwt.filer_signing] — the filer rejects unsigned HTTP writes, and its
      # IAM gRPC service requires an admin Bearer token, which the operator
      # signs for itself. The filer UI's own upload form does not sign its
      # requests, so it stops working while this is on.
      filerWrite: false

      # [jwt.filer_signing.read] — the filer rejects unsigned HTTP reads as
      # well. The S3 gateway signs its reads; plain HTTP GETs (including the
      # filer UI) do not. The operator moves the filer probes to /healthz so
      # they keep answering.
      filerRead: false

      # Positive values override seaweedfs' token lifetimes. Zero (the default)
      # keeps its own: 10s for writes, 60s for reads.
      expiresAfterSeconds:
        volumeWrite: 0
        volumeRead: 0
        filerWrite: 0
        filerRead: 0
