# One Seaweed CR runs the masters and filers and places volume servers per
# data center and rack with volumeTopology. Volume servers of another Seaweed
# CR join that CR's own masters, so racks are split into groups here, not
# into separate CRs.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed-topology
  namespace: default
spec:
  image: chrislusf/seaweedfs:latest
  volumeServerDiskCount: 1

  master:
    replicas: 3
    volumeSizeLimitMB: 1024
    # 110: one copy on another rack of the same data center and one copy in
    # another data center. The first digit counts other data centers, so
    # "210" would need three of them.
    defaultReplication: "110"

  # Defaults for every volumeTopology group; replicas: 0 runs no volume
  # servers outside the groups.
  volume:
    replicas: 0
    requests:
      storage: 10Gi

  volumeTopology:
    dc1-rack1:
      replicas: 3
      rack: "rack1"
      dataCenter: "dc1"
      nodeSelector:
        seaweedfs/datacenter: "dc1"
        seaweedfs/rack: "rack1"

    dc1-rack2:
      replicas: 3
      rack: "rack2"
      dataCenter: "dc1"
      nodeSelector:
        seaweedfs/datacenter: "dc1"
        seaweedfs/rack: "rack2"

    dc2-rack1:
      replicas: 3
      rack: "rack1"
      dataCenter: "dc2"
      nodeSelector:
        seaweedfs/datacenter: "dc2"
        seaweedfs/rack: "rack1"

    dc2-rack2:
      replicas: 3
      rack: "rack2"
      dataCenter: "dc2"
      nodeSelector:
        seaweedfs/datacenter: "dc2"
        seaweedfs/rack: "rack2"

  filer:
    replicas: 2
    s3:
      enabled: true
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
