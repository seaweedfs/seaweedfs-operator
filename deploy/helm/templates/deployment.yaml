{{- $healthProbePort := int .Values.healthProbe.port }}
{{- $metricsPort := int .Values.port.number }}
{{- if ne (float64 .Values.healthProbe.port) (float64 $healthProbePort) }}
{{- fail "healthProbe.port must be an integer" }}
{{- end }}
{{- if or (lt $healthProbePort 1) (gt $healthProbePort 65535) }}
{{- fail "healthProbe.port must be a valid TCP port (1-65535)" }}
{{- end }}
{{- if or (eq $metricsPort $healthProbePort) (and .Values.webhook.enabled (or (eq 9443 $healthProbePort) (eq 9443 $metricsPort))) }}
{{- fail "healthProbe.port must differ from port.number; when webhooks are enabled, both ports must differ from webhook port 9443" }}
{{- end }}
{{- if eq .Values.port.name "health" }}
{{- fail "port.name must not be \"health\" because that name is reserved for the manager health port" }}
{{- end }}
{{- if and .Values.webhook.enabled (eq .Values.port.name "https") }}
{{- fail "port.name must not be \"https\" because that name is reserved for the webhook port" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seaweedfs-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs-operator.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "seaweedfs-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "seaweedfs-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.commonAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{ if or .Values.image.credentials .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ include "seaweedfs-operator.pullSecretName" . }}
      {{ end }}
      serviceAccountName: {{ include "seaweedfs-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "seaweedfs-operator.scheduling" . | nindent 6 }}
      containers:
      - name: seaweedfs-operator
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ include "seaweedfs-operator.image" (dict "imageRoot" .Values.image "tag" (default .Chart.AppVersion .Values.image.tag) "global" .Values.global) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --metrics-bind-address=:{{ .Values.port.number }}
        - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
        {{- if .Values.bucketUsage }}
        {{- if .Values.bucketUsage.refreshInterval }}
        - --bucket-usage-refresh-interval={{ .Values.bucketUsage.refreshInterval }}
        {{- end }}
        {{- end }}
        env:
        {{- if eq .Values.webhook.enabled false }}
        - name: ENABLE_WEBHOOKS
          value: "false"
        {{- end }}
        {{- if .Values.csiDriver }}
        {{- if .Values.csiDriver.enabled }}
        - name: ENABLE_CSI_DRIVER
          value: "true"
        {{- end }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- range . }}
        {{- if eq .name "ENABLE_CSI_DRIVER" }}
        {{- fail "set csiDriver.enabled instead of ENABLE_CSI_DRIVER in extraEnv: that value also grants the manager the RBAC the SeaweedCSIDriver controller needs" }}
        {{- end }}
        {{- end }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: {{ .Values.port.name }}
          containerPort: {{ .Values.port.number }}
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - name: https
          containerPort: 9443
          protocol: TCP
        {{- end }}
        - name: health
          containerPort: {{ .Values.healthProbe.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- if .Values.resources }}
        resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- end }}
      terminationGracePeriodSeconds: 10
      {{- if .Values.webhook.enabled }}
      {{- $certManager := default dict .Values.webhook.certManager }}
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: {{ include "seaweedfs-operator.webhookCertificateSecretName" . }}
          items:
          {{- if $certManager.enabled }}
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          {{- else }}
          - key: cert
            path: tls.crt
          - key: key
            path: tls.key
          {{- end }}
      {{- end }}
