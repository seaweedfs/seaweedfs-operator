{{- if .Values.rbac.create }}
{{- $watchNamespaces := .Values.watchNamespaces | default (list) }}
{{- if $watchNamespaces }}
{{- range $ns := $watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  creationTimestamp: null
  name: {{ include "seaweedfs-operator.fullname" $ }}-manager-role
  namespace: {{ $ns }}
rules:
{{ include "seaweedfs-operator.managerNamespacedRules" $ }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: {{ include "seaweedfs-operator.fullname" . }}-manager-role
rules:
{{ include "seaweedfs-operator.managerClusterRules" . }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: {{ include "seaweedfs-operator.fullname" . }}-manager-role
rules:
{{ include "seaweedfs-operator.managerNamespacedRules" . }}
{{ include "seaweedfs-operator.managerClusterRules" . }}
{{- end }}
{{- end }}
