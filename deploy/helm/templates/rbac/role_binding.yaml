{{- if .Values.rbac.create }}
{{- $watchNamespaces := .Values.watchNamespaces | default (list) | compact | uniq }}
{{- if $watchNamespaces }}
{{- range $ns := $watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "seaweedfs-operator.fullname" $ }}-manager-rolebinding
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "seaweedfs-operator.fullname" $ }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "seaweedfs-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "seaweedfs-operator.fullname" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "seaweedfs-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "seaweedfs-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
