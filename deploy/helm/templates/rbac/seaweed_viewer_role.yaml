# permissions for end users to view seaweeds.
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: seaweed-viewer-role
rules:
- apiGroups:
  - seaweed.seaweedfs.com
  resources:
  - seaweeds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - seaweed.seaweedfs.com
  resources:
  - seaweeds/status
  verbs:
  - get
{{- end -}}